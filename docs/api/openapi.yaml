openapi: 3.1.0
info:
  title: ScoutHub API
  version: 0.1.0
  description: |
    Sprint 0 contract — Role B uses this to build the web and mobile apps
    before the real backend is ready. Run a mock server with:
      npx @stoplight/prism-cli mock docs/api/openapi.yaml

servers:
  - url: http://localhost:8080/api
    description: Local backend (every route is served under /api)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Invalid request body (see "errors" for each field)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing, invalid or expired token, or disabled account
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: The user's role does not allow this action
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    # ── Auth & users (owner: Zaid) ────────────────────────────────────
    Role:
      type: string
      enum: [ADMIN, ANALYST, SCOUT, RECRUITER]
      description: Self-registered accounts are SCOUT; an ADMIN grants the other roles.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:    { type: string, format: email }
        password: { type: string }

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:    { type: string, format: email, maxLength: 255 }
        password: { type: string, minLength: 8, maxLength: 72 }
        fullName: { type: string, maxLength: 150 }

    UpdateProfileRequest:
      type: object
      properties:
        fullName: { type: string, maxLength: 150 }

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword:     { type: string, minLength: 8, maxLength: 72 }

    UpdateUserRequest:
      type: object
      description: Only the fields sent are changed. An admin cannot change their own role or disable themselves.
      properties:
        role:    { $ref: '#/components/schemas/Role' }
        enabled: { type: boolean }

    AuthResponse:
      type: object
      properties:
        token:     { type: string, description: 'Send as "Authorization: Bearer <token>"' }
        expiresAt: { type: string, format: date-time }
        user:      { $ref: '#/components/schemas/User' }

    User:
      type: object
      properties:
        id:          { type: string, format: uuid }
        email:       { type: string }
        fullName:    { type: [string, 'null'] }
        role:        { $ref: '#/components/schemas/Role' }
        enabled:     { type: boolean }
        createdAt:   { type: string, format: date-time }
        lastLoginAt: { type: [string, 'null'], format: date-time }

    Player:
      type: object
      properties:
        id:           { type: string, format: uuid }
        name:         { type: string }
        position:     { type: string }
        club:         { type: string }
        league:       { type: string }
        nationality:  { type: string }
        age:          { type: integer }
        marketValue:  { type: number, description: "Current Transfermarkt value in €" }
        fairValue:    { type: number, description: "Model predicted value in €" }
        signal:       { type: string, enum: [UNDERVALUED, OVERVALUED, FAIR] }

    PagedPlayers:
      type: object
      properties:
        content:    { type: array, items: { $ref: '#/components/schemas/Player' } }
        totalItems: { type: integer }
        page:       { type: integer }
        pageSize:   { type: integer }

    # ── Datasets (owner: Aymen) ───────────────────────────────────────
    Problem:
      type: object
      description: RFC 7807 error body returned by every endpoint (application/problem+json)
      properties:
        title:  { type: string, example: "Requête invalide" }
        status: { type: integer, example: 400 }
        detail: { type: string, example: "Seuls les fichiers .csv sont acceptés." }
        errors:
          type: object
          additionalProperties: { type: string }
          description: Validation errors only — one message per invalid field

    DatasetSummary:
      type: object
      properties:
        id:           { type: integer, format: int64 }
        title:        { type: string }
        description:  { type: [string, 'null'] }
        category:     { type: [string, 'null'] }
        source:       { type: [string, 'null'] }
        fileName:     { type: string }
        ownerEmail:   { type: [string, 'null'] }
        importedAt:   { type: string, format: date-time }
        rowCount:     { type: integer }
        columnCount:  { type: integer }
        qualityScore: { type: number, description: "0 to 100" }
        qualityGrade: { type: string, enum: [A, B, C, D] }

    ColumnProfile:
      type: object
      description: Statistics of one column. Numeric fields are null for non-numeric columns.
      properties:
        position: { type: integer }
        name:     { type: string }
        type:     { type: string, enum: [INTEGER, DECIMAL, BOOLEAN, DATE, CATEGORY, TEXT] }
        count:    { type: integer, description: "non-missing values" }
        missing:  { type: integer }
        distinct: { type: integer }
        invalid:  { type: integer, description: "values that do not match the column type" }
        min:      { type: [number, 'null'] }
        max:      { type: [number, 'null'] }
        mean:     { type: [number, 'null'] }
        median:   { type: [number, 'null'] }
        stdDev:   { type: [number, 'null'] }
        q1:       { type: [number, 'null'] }
        q3:       { type: [number, 'null'] }
        outliers: { type: [integer, 'null'], description: "IQR rule" }
        minDate:  { type: [string, 'null'], format: date }
        maxDate:  { type: [string, 'null'], format: date }
        topValues:
          type: [array, 'null']
          items:
            type: object
            properties:
              value: { type: string }
              count: { type: integer }
        geoRole:  { type: [string, 'null'], enum: [LATITUDE, LONGITUDE, null] }

    ColumnInfo:
      type: object
      properties:
        position: { type: integer }
        name:     { type: string }
        type:     { type: string, enum: [INTEGER, DECIMAL, BOOLEAN, DATE, CATEGORY, TEXT] }
        profile:  { $ref: '#/components/schemas/ColumnProfile' }

    QualityReport:
      type: object
      properties:
        score:        { type: number, description: "100 × (0.40·completeness + 0.20·uniqueness + 0.25·validity + 0.15·consistency)" }
        grade:        { type: string, enum: [A, B, C, D] }
        completeness: { type: number, description: "0 to 1" }
        uniqueness:   { type: number }
        validity:     { type: number }
        consistency:  { type: number }
        issues:       { type: array, items: { type: string } }

    VizRecommendation:
      type: object
      properties:
        chart:    { type: string, enum: [MAP, LINE, SCATTER, BAR, PIE, HISTOGRAM, BOX] }
        title:    { type: string }
        columns:  { type: array, items: { type: string }, description: "x first, then y" }
        reason:   { type: string }
        priority: { type: integer }

    Correlation:
      type: object
      properties:
        columnA:     { type: string }
        columnB:     { type: string }
        coefficient: { type: number, description: "Pearson r, -1 to 1" }
        pairs:       { type: integer }

    DatasetDetail:
      type: object
      properties:
        dataset:         { $ref: '#/components/schemas/DatasetSummary' }
        duplicateRows:   { type: integer }
        columns:         { type: array, items: { $ref: '#/components/schemas/ColumnInfo' } }
        quality:         { $ref: '#/components/schemas/QualityReport' }
        recommendations: { type: array, items: { $ref: '#/components/schemas/VizRecommendation' } }
        correlations:    { type: array, items: { $ref: '#/components/schemas/Correlation' } }

    RowsPage:
      type: object
      properties:
        content:
          type: array
          items:
            type: object
            additionalProperties: true
            description: 'One row: { "column name": value }'
        totalItems: { type: integer, format: int64 }
        page:       { type: integer }
        pageSize:   { type: integer }

security:
  - bearerAuth: []

paths:
  # ── Auth (owner: Zaid) ────────────────────────────────────────────
  # Every route except register / login needs "Authorization: Bearer <token>".
  # 401 = no / invalid / expired token or disabled account · 403 = role not allowed.
  # Role checks in controllers: @PreAuthorize("hasRole('ANALYST')"); authentication.getName() is the email.
  /auth/register:
    post:
      tags: [Auth]
      summary: Create an account (role SCOUT) and get a JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Account created, logged in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Email already used
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate and get JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: JWT token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401':
          description: Wrong email or password (same message for both)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: Account disabled
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /auth/me:
    get:
      tags: [Auth]
      summary: Profile of the logged-in user
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Auth]
      summary: Update own profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/me/password:
    put:
      tags: [Auth]
      summary: Change own password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204': { description: Password changed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ── Users (owner: Zaid, ADMIN only) ───────────────────────────────
  /users:
    get:
      tags: [Users]
      summary: List users (ADMIN)
      parameters:
        - { in: query, name: q, schema: { type: string }, description: Search in email and name }
        - { in: query, name: role, schema: { $ref: '#/components/schemas/Role' } }
      responses:
        '200':
          description: Users, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /users/{id}:
    patch:
      tags: [Users]
      summary: Change a user's role or enable / disable the account (ADMIN)
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Unknown user
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Admin tried to change their own role or disable themselves
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /players:
    get:
      summary: Search players
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: position
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, default: 0 }
        - in: query
          name: size
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Paged player list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagedPlayers' }

  /players/{id}:
    get:
      summary: Get player details
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Player detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Player' }

  # ── Datasets (owner: Aymen) ─────────────────────────────────────────
  /datasets:
    get:
      tags: [Datasets]
      summary: List datasets
      parameters:
        - { in: query, name: q, schema: { type: string }, description: "searched in title and description" }
        - { in: query, name: category, schema: { type: string } }
      responses:
        '200':
          description: Datasets, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DatasetSummary' } }
    post:
      tags: [Datasets]
      summary: Import a CSV file (ANALYST or ADMIN)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, title]
              properties:
                file:        { type: string, format: binary, description: ".csv, separator , ; tab or |, max 20 MB" }
                title:       { type: string, maxLength: 200 }
                description: { type: string }
                category:    { type: string, maxLength: 80 }
                source:      { type: string, maxLength: 300 }
      responses:
        '201':
          description: Dataset created (Location header points to it)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatasetSummary' }
        '400':
          description: Invalid file or missing title
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '413':
          description: File too large
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /datasets/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [Datasets]
      summary: Dataset detail — column profiles, quality report, recommended charts, correlations
      responses:
        '200':
          description: Dataset detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatasetDetail' }
        '404':
          description: Unknown dataset
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [Datasets]
      summary: Delete a dataset (its owner or an ADMIN)
      responses:
        '204': { description: Deleted }
        '403':
          description: Not the owner
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Unknown dataset
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /datasets/{id}/rows:
    get:
      tags: [Datasets]
      summary: Dataset rows — paginated, with search, column filter and sort
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
        - { in: query, name: page, schema: { type: integer, default: 0 } }
        - { in: query, name: size, schema: { type: integer, default: 50, maximum: 200 } }
        - { in: query, name: q, schema: { type: string }, description: "searched in every cell" }
        - { in: query, name: filterColumn, schema: { type: string } }
        - { in: query, name: filterValue, schema: { type: string }, description: "case-insensitive contains" }
        - { in: query, name: sort, schema: { type: string }, description: "column name; numeric columns sort as numbers" }
        - { in: query, name: dir, schema: { type: string, enum: [asc, desc], default: asc } }
      responses:
        '200':
          description: One page of rows
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RowsPage' }
        '400':
          description: Unknown column in sort or filterColumn
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Unknown dataset
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
