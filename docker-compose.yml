# =====================================================================
#  ScoutHub — Smart Data Platform
#  Monorepo Docker Compose
#
#  Profiles:
#    default   : postgres, redis, backend, ml, web
#    ai        : ollama (heavy — GPU optional)
#    monitoring: prometheus, grafana
#
#  Quick start:
#    cp .env.example .env
#    docker compose up -d
#    docker compose --profile ai up -d          # + Ollama
#    docker compose --profile monitoring up -d  # + Prometheus + Grafana
# =====================================================================

name: scouthub

services:

  # ── Data stores ────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: scouthub-postgres
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-scouthub}
      POSTGRES_USER:     ${POSTGRES_USER:-scouthub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scouthub}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [scouthub]
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: scouthub-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [scouthub]
    restart: unless-stopped

  # ── Backend ────────────────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: scouthub-backend
    environment:
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres:5432/${POSTGRES_DB:-scouthub}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-scouthub}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      SPRING_REDIS_HOST:          redis
      SPRING_REDIS_PORT:          6379
      JWT_SECRET:                 ${JWT_SECRET:-change_me_32_chars_minimum_here__}
      JWT_EXPIRY_MS:              ${JWT_EXPIRY_MS:-86400000}
      CORS_ALLOWED_ORIGINS:       ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      ADMIN_EMAIL:                ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD:             ${ADMIN_PASSWORD:-}
      ML_SERVICE_URL:             http://ml:8000
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    networks: [scouthub]
    restart: unless-stopped

  # ── ML Service ─────────────────────────────────────────────────────
  ml:
    build: ./ml
    container_name: scouthub-ml
    environment:
      POSTGRES_URL: postgresql://${POSTGRES_USER:-scouthub}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-scouthub}
      OLLAMA_URL:   http://ollama:11434
    ports:
      - "${ML_PORT:-8000}:8000"
    volumes:
      - ./ml/models:/app/models
    depends_on:
      postgres: { condition: service_healthy }
    networks: [scouthub]
    restart: unless-stopped

  # ── Web ────────────────────────────────────────────────────────────
  web:
    build:
      context: ./web
      target: dev
    container_name: scouthub-web
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    networks: [scouthub]
    restart: unless-stopped

  # ── Ollama (profile: ai) ───────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: scouthub-ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks: [scouthub]
    profiles: [ai]
    restart: unless-stopped

  # ── Prometheus (profile: monitoring) ──────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: scouthub-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [scouthub]
    profiles: [monitoring]
    restart: unless-stopped

  # ── Grafana (profile: monitoring) ─────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.3
    container_name: scouthub-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    networks: [scouthub]
    profiles: [monitoring]
    restart: unless-stopped

networks:
  scouthub:
    name: scouthub-net

volumes:
  postgres-data:
  redis-data:
  ollama-data:
  prometheus-data:
  grafana-data:
