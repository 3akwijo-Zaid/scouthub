spring:
  application:
    name: scouthub-backend
  datasource:
    url:      ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/scouthub}
    username: ${SPRING_DATASOURCE_USERNAME:scouthub}
    password: ${SPRING_DATASOURCE_PASSWORD:change_me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: ${DATASET_MAX_FILE_SIZE:20MB}
      max-request-size: ${DATASET_MAX_FILE_SIZE:20MB}

server:
  port: 8080
  servlet:
    # Every route is served under /api, so the Vite proxy (/api → backend) and Nginx work without rewrites.
    context-path: /api

jwt:
  secret:    ${JWT_SECRET:change_me_32_chars_minimum_here__}
  expiryMs:  ${JWT_EXPIRY_MS:86400000}

ml:
  serviceUrl: ${ML_SERVICE_URL:http://localhost:8000}

scouthub:
  cors:
    # Comma-separated origins allowed to call the API from a browser (not needed behind the same Nginx)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  admin:
    # First administrator, created at startup only while no ADMIN exists
    email:    ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

datasets:
  # Hard limits for one CSV import
  max-rows: ${DATASET_MAX_ROWS:200000}
  max-columns: ${DATASET_MAX_COLUMNS:200}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: scouthub-backend
