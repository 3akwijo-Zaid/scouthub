name: Web CI

on:
  push:
    branches: [main, develop]
    paths: ['web/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      # Skipped until the Vite app (index.html, src/, package-lock.json) is committed
      - name: Check that the web app exists
        id: guard
        run: |
          if [ -f package-lock.json ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "::notice::web/package-lock.json missing, web build skipped"; fi
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.ready == 'true'
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install
        if: steps.guard.outputs.ready == 'true'
        run: npm ci
      - name: Lint
        if: steps.guard.outputs.ready == 'true'
        run: npm run lint
      - name: Type check and build
        if: steps.guard.outputs.ready == 'true'
        run: npm run build
